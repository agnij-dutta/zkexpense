[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# bb-generated verifiers are ~64 bytes over EIP-170 at 200 runs; compile them for size.
additional_compiler_profiles = [{ name = "size", optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "src/verifiers/*.sol", optimizer_runs = 1 }]
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
